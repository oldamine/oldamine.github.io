<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpikeyCactus Online Animation Viewer!</title>
  
  <link href="http://vjs.zencdn.net/4.12/video-js.css" rel="stylesheet">
  <script src="http://vjs.zencdn.net/4.12/video.js"></script>

  <style>
    /* Global layout fix for legacy Firefox/Opera layout engine sizing */
    *, *:before, *:after {
      -moz-box-sizing: border-box;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    /* ========================================================
       BASE LIGHT THEME (Default View)
       ======================================================== */
    body {
      background-color: #f0f0f0;
      color: #111;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .player-container {
      display: block;
      max-width: 900px;
      margin: 20px auto;
    }
    
    .video-holder {
      float: left;
      width: 640px;
    }
    
    .playlist-holder {
      float: left;
      width: 240px;
      margin-left: 20px;
      background: #fff;
      color: #111;
      border: 1px solid #ccc;
    }
    
    .playlist-holder h3 {
      margin: 0;
      padding: 10px;
      background: #e0e0e0;
      font-size: 16px;
      border-bottom: 1px solid #ccc;
    }
    
    /* ========================================================
       CROSS-BROWSER COMPATIBLE SLIDER COMPONENT
       ======================================================== */
    .theme-toggle-box {
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      font-size: 12px;
    }
    
    .theme-toggle-label {
      float: left;
      line-height: 20px;
      font-weight: bold;
    }
    
    .switch {
      float: right;
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    
    /* Invisible layer to catch clicks on old layout engines */
    .switch input { 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      filter: alpha(opacity=0);
    }
    
    /* The slider track track */
    .slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      border-radius: 20px;
      z-index: 1;
    }
    
    /* The physical knob element (Fixes Opera/Firefox repaint bugs) */
    .knob {
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
    }
    
    /* Checked States */
    input:checked + .slider {
      background-color: #0070FF;
    }
    
    input:checked + .slider .knob {
      left: 23px;
    }

    /* ========================================================
       PLAYLIST AND META CONTAINER STYLES
       ======================================================== */
    .playlist-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 278px;
      overflow-y: auto;
    }
    
    .playlist-item {
      display: block;
      padding: 12px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      line-height: 1.2;
      clear: both;
    }
    
    .playlist-item:hover {
      background: #f5f5f5;
    }
    
    .playlist-item.active {
      background: #0070FF;
      color: #fff;
    }
    
    .meta-holder {
      margin-top: 15px;
      padding: 15px;
      background: #fafafa;
      border: 1px solid #ccc;
      border-radius: 4px;
      clear: both;
    }
    
    .meta-holder h4 {
      margin: 0 0 8px 0;
      color: #0070FF;
    }
    
    .meta-holder p {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #444;
      line-height: 1.4;
    }
    
    .meta-links a {
      color: #2980b9;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      margin-right: 15px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      background: #eee;
      border-radius: 3px;
    }
    
    .meta-links a:hover {
      background: #ddd;
    }

    /* ========================================================
       NIGHT MODE STYLES
       ======================================================== */
    body.night-mode {
      background-color: #111;
      color: #fff;
    }
    body.night-mode .playlist-holder {
      background: #222;
      color: #fff;
      border-color: #444;
    }
    body.night-mode .playlist-holder h3 {
      background: #333;
      border-bottom-color: #444;
    }
    body.night-mode .theme-toggle-box {
      background: #222;
      border-bottom-color: #444;
    }
    body.night-mode .playlist-item {
      border-bottom-color: #333;
    }
    body.night-mode .playlist-item:hover {
      background: #444;
    }
    body.night-mode .playlist-item.active {
      background: #0070FF;
      color: #fff;
    }
    body.night-mode .meta-holder {
      background: #1c1c1c;
      border-color: #333;
    }
    body.night-mode .meta-holder p {
      color: #ccc;
    }
    body.night-mode .meta-links a {
      color: #3498db;
      background: #222;
      border-color: #444;
    }
    body.night-mode .meta-links a:hover {
      background: #333;
    }

    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }
  </style>
</head>
<body>

<div class="player-container clearfix">
  
  <div class="video-holder">
    <video id="retro_player" class="video-js vjs-default-skin" controls preload="auto" width="640" height="360" 
           data-setup='{"techOrder": ["html5", "flash"]}'>
      <source src="https://oldamine.github.io/vids/mp4/appelandbasbat.mp4" type="video/mp4">
      <source src="https://oldamine.github.io/vids/webm/appelandbasbat.webm" type="video/webm">
      <source src="https://oldamine.github.io/vids/ogv/appelandbasbat.ogv" type="video/ogg">
      <source src="https://oldamine.github.io/vids/flv/appelandbasbat.flv" type="video/x-flv">
      <p class="vjs-no-js">
        Your browser does not support HTML5 video or Flash.

    <div class="meta-holder">

      <div class="meta-links">
        <a id="video-source-link" href="#" target="_blank">Download the FLA! (Flash CS6 or higher)</a>
        <a id="video-download-link" href="#" target="_blank" download>Download UNCOMPRESSED Video</a>
      </div>
    </div>
  </div>

  <div class="playlist-holder">
    <h3>SpikeyCactus Online Animation Viewer!</h3>
    
    <div class="theme-toggle-box clearfix">
      <div class="theme-toggle-label">Night Mode</div>
      <label class="switch">
        <input type="checkbox" id="theme-switch" onchange="toggleTheme()">
        <span class="slider">
          <span class="knob"></span>
        </span>
      </label>
    </div>

    <ul id="playlist" class="playlist-list"></ul>

    <div style="text-align: center; margin-top: 15px; padding: 10px; border-top: 1px dashed #ccc;">
      <a href="https://www.hitwebcounter.com/business-days-calculator" target="_blank" rel="noopener" title="Days Counter">
        <img src="https://www.hitwebcounter.com/counter/counter.php?page=21505831&style=0019&nbdigits=5&type=page" alt="Days Counter" decoding="async" style="border:0; max-width:100%; height:auto;" />
      </a>
      <br />
      <a href="https://www.hitwebcounter.com/" target="_blank" rel="noopener" style="font-family: Geneva, Arial, Helvetica, sans-serif; font-size: 9px; color: #908C86; text-decoration: underline; font-weight: bold;">www.hitwebcounter.com</a>
      </div>
  </div>

</div>

<script>
  videojs.options.flash.swf = "player/video-js.swf";

  var myPlaylist = [
    {
      title: "AppleBaseballPuppets.mp4",
      description: "A reanimated II scene.",
      sourceLink: "https://oldamine.github.io/vids/flas/AppleBaseballPuppets.fla",
      downloadLink: "https://oldamine.github.io/vids/mp4/AppleBaseballPuppets.mp4",
      sources: [
        { src: "https://oldamine.github.io/vids/mp4/AppleBaseballPuppets.mp4", type: "video/mp4" },
        { src: "https://oldamine.github.io/vids/webm/AppleBaseballPuppets.webm", type: "video/webm" },
        { src: "https://oldamine.github.io/vids/ogv/AppleBaseballPuppets.ogv", type: "video/ogg" },
        { src: "https://oldamine.github.io/vids/flv/AppleBaseballPuppets.flv", type: "video/x-flv" }
      ]
    },
    {
      title: "AppleBaseballPuppets OR is IT???",
      description: "A reanimated II scene with a TWIST??",
      sourceLink: "https://oldamine.github.io/vids/flas/AppleBaseballPuppetsTwist.fla",
      downloadLink: "https://oldamine.github.io/vids/mp4/appelandbasbat.mp4",
      sources: [
        { src: "https://oldamine.github.io/vids/mp4/appelandbasbat.mp4", type: "video/mp4" },
        { src: "https://oldamine.github.io/vids/webm/appelandbasbat.webm", type: "video/webm" },
        { src: "https://oldamine.github.io/vids/ogv/appelandbasbat.ogv", type: "video/ogg" },
        { src: "https://oldamine.github.io/vids/flv/appelandbasbat.flv", type: "video/x-flv" }
      ]
    },
    {
      title: "Whooper Whooper Whooper!",
      description: "I mean what is there to even say?",
      sourceLink: "https://oldamine.github.io/vids/flas/wooper3.0.fla",
      downloadLink: "https://oldamine.github.io/vids/mp4/wooper3.mp4",
      sources: [
        { src: "https://oldamine.github.io/vids/mp4/wooper3.mp4", type: "video/mp4" },
        { src: "https://oldamine.github.io/vids/webm/wooper3.webm", type: "video/webm" },
        { src: "https://oldamine.github.io/vids/ogv/wooper3.ogv", type: "video/ogg" },
        { src: "https://oldamine.github.io/vids/flv/wooper3.flv", type: "video/x-flv" }
      ]
    },
    {
      title: "I steal CHEESE!!!!",
      description: "Man, Listen to the title!",
      sourceLink: "https://oldamine.github.io/vids/flas/isc.fla",
      downloadLink: "https://oldamine.github.io/vids/mp4/isc.mp4",
      sources: [
        { src: "https://oldamine.github.io/vids/mp4/isc.mp4", type: "video/mp4" },
        { src: "https://oldamine.github.io/vids/webm/isc.webm", type: "video/webm" },
        { src: "https://oldamine.github.io/vids/ogv/isc.ogv", type: "video/ogg" },
        { src: "https://oldamine.github.io/vids/flv/isc.flv", type: "video/x-flv" }
      ]
    },
    {
      title: "New! Bitty and Stick!",
      description: "A one A two A STICK A BIT",
      sourceLink: "https://oldamine.github.io/vids/flas/StickBitty.fla",
      downloadLink: "https://oldamine.github.io/vids/mp4/StickBitty.mp4",
      sources: [
        { src: "https://oldamine.github.io/vids/mp4/StickBitty.mp4", type: "video/mp4" },
        { src: "https://oldamine.github.io/vids/webm/StickBitty.webm", type: "video/webm" },
        { src: "https://oldamine.github.io/vids/ogv/StickBitty.ogv", type: "video/ogg" },
        { src: "https://oldamine.github.io/vids/flv/StickBitty.flv", type: "video/x-flv" }
      ]
    }
  ];

  var currentTrackIndex = 0;
  var player = videojs("retro_player");

  function toggleTheme() {
    var checkbox = document.getElementById("theme-switch");
    if (checkbox.checked) {
      document.body.className = "night-mode";
    } else {
      document.body.className = "";
    }
  }

  function buildPlaylistUI() {
    var listElement = document.getElementById("playlist");
    listElement.innerHTML = ""; 

    for (var i = 0; i < myPlaylist.length; i++) {
      var li = document.createElement("li");
      li.className = "playlist-item";
      if (i === currentTrackIndex) { li.className += " active"; }
      li.innerHTML = myPlaylist[i].title;
      
      (function(index) {
        li.onclick = function() { changeTrack(index); };
      })(i);

      listElement.appendChild(li);
    }
  }

  function updateMetadataUI(track) {
    document.getElementById("video-title").innerHTML = track.title;
    
    if (track.description) {
      document.getElementById("video-description").innerHTML = track.description;
      document.getElementById("video-description").style.display = "block";
    } else {
      document.getElementById("video-description").style.display = "none";
    }

    if (track.sourceLink) {
      document.getElementById("video-source-link").setAttribute("href", track.sourceLink);
      document.getElementById("video-source-link").style.display = "inline-block";
    } else {
      document.getElementById("video-source-link").style.display = "none";
    }

    if (track.downloadLink) {
      document.getElementById("video-download-link").setAttribute("href", track.downloadLink);
      document.getElementById("video-download-link").style.display = "inline-block";
    } else {
      document.getElementById("video-download-link").style.display = "none";
    }
  }

  function changeTrack(index) {
    if (index < 0 || index >= myPlaylist.length) return;
    
    currentTrackIndex = index;
    buildPlaylistUI(); 
    updateMetadataUI(myPlaylist[index]);

    player.src(myPlaylist[index].sources);
    
    player.ready(function() {
      player.play();
    });
  }

  player.on("ended", function() {
    var nextIndex = currentTrackIndex + 1;
    if (nextIndex < myPlaylist.length) { changeTrack(nextIndex); }
  });

  player.ready(function() {
    buildPlaylistUI();
    updateMetadataUI(myPlaylist[currentTrackIndex]);
  });
</script>

</body>
</html>
