
<head>

	<title>Simple playlist example</title>
	<link rel="stylesheet" type="text/css" href="css/common.css" />
	<link rel="stylesheet" type="text/css" href="css/simple-playlist.css"/>
	
	<script src="js/jquery.pack.js"></script>
	<script src="js/flashembed.min.js"></script>
	<script src="js/flow.playlist.js"></script>
	

	<script type="text/javascript"> 
	
		// setup playlist 
		$(function() {			
			$("#playlist").playlist("player/FlowPlayer.swf", {initialScale:'scale'});
		}); 
		
	</script>     

</head>

<div id="page">

	<h1>SpikeyCactus Online Animation Viewer!</h1>	
	<!-- player is initially loaded with splash screen and play button -->
	<a id="player">
		<img src="img/3m.jpg" />
		<div class="play"></div>
	</a>
	
	<!-- this is our playlist -->
	<div id="playlist">

		<a href="http://oldamine.github.io/vids/flv/AppleBaseballPuppets.flv">
			<p>A reanimated II scene.</p>		
			<p class="time">16 seconds</p>
		</a>

			<a href="http://oldamine.github.io/vids/flv/appelandbasbat.flv">
			<p> A reanimated II scene with a TWIST! Idea by 
				<a href="https://www.youtube.com/@LordmonkeyTRM">
				TheRetroMacaque</a> 
			</p>		
			<p class="time">10 seconds</p>
		</a>
		
		<a href="http://oldamine.github.io/vids/flv/isc.flv">
			<p>I steal CHEESE!!!!</p>		
			<p class="time">3 seconds</p>
		</a>
		
		<a href="http://oldamine.github.io/vids/flv/wooper3.flv">
			<p>Whooper Whooper Whooper! I mean what else is there to say?</p>		
			<p class="time">9 seconds</p>
		</a>
		
		<a href="http://oldamine.github.io/vids/flv/StickBitty.flv">
			<strong> NEW!! </strong>
			<p>Bitty and Stick!</p>		
			<p class="time">3 seconds</p>
		</a>
		
	</div>

	<!-- clear floatings -->
	<br clear="all" />

	<p>
		<button onClick="location.href='index.html'">&laquo; back to examples</button>
	</p>
	
</div>
