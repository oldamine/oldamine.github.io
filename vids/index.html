<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose Your Playlist Player Version</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    
    .selector-container {
      max-width: 500px;
      margin: 0 auto;
      background: #222;
      padding: 30px;
      border: 1px solid #444;
      border-radius: 6px;
    }

    h2 {
      margin-top: 0;
      color: #0070FF;
      font-size: 22px;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* Button Styling */
    .player-btn {
      display: inline-block;
      width: 80%;
      margin: 10px 0;
      padding: 12px 20px;
      background: #333;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      /* Smooth fade for older browsers that support transitions */
      transition: background 0.2s, border-color 0.2s;
    }

    /* Hover effect matching your playlist selection color */
    .player-btn:hover {
      background: #0070FF;
      border-color: #0050B3;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="selector-container">
  <h2>Select Player Version</h2>
  <p>Choose the format version best suited for your browser:</p>
  
  <a class="player-btn" href="html5.html">Launch HTML5/Flash Player</a>
  <a class="player-btn" href="flash.html">Launch Classic Flash Player</a>
</div>

</body>
</html>
